<div class="panel">
  <div class="panel__head">
    <span class="panel__title">实时频谱（当前窗口）</span>
    <span class="panel__hint" id="spec-hint">
      横轴 = 频率（本窗口 ±10 MHz），纵轴 = 功率码（相对 dB 码，不是 dBm）；点 = 当前帧，线 = 峰值保持
    </span>
  </div>
  <div class="panel__body">
    <canvas id="spec-canvas" class="plot" height="210"></canvas>
  </div>
</div>

<div class="panel">
  <div class="panel__head">
    <span class="panel__title">3D 瀑布</span>
    <span class="panel__hint">越靠前越新；高度 = 功率码；鼠标左键旋转 / 滚轮缩放</span>
  </div>
  <div class="panel__body" id="wf-3d" style="height: 300px;"></div>
</div>

<div class="panel">
  <div class="panel__head">
    <span class="panel__title">2D 瀑布（最近 180 帧）</span>
    <span class="panel__hint">同一条数据流，看不惯 3D 就看这张</span>
  </div>
  <div class="panel__body">
    <canvas id="wf-canvas" class="plot" height="150"></canvas>
  </div>
</div>
